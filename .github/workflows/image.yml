# .github/workflows/image.yml
# 触发：push 到 prod 分支（rebase 后强推也会触发）
# 产出：ghcr.io/<owner>/<repo>:<上游tag>-hide.<sha>
name: build-image

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 tag 才能算出上游基线版本
          fetch-depth: 0

      - name: Compute image name and tag
        run: |
          set -euo pipefail
          # 最近的一个 tag 就是 rebase 时的上游基线，如 v1.0.0-rc.51
          BASE="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse --short HEAD)"
          fi
          # 官方 Dockerfile 用 VERSION 文件注入 binary 版本号；仓库里该文件是空的
          echo "$BASE" > VERSION
          REPO="${GITHUB_REPOSITORY,,}"          # GHCR 要求全小写
          IMAGE="ghcr.io/${REPO}"
          VER="${BASE}-hide.${GITHUB_SHA::7}"
          {
            echo "IMAGE=${IMAGE}"
            echo "VER=${VER}"
          } >> "$GITHUB_ENV"
          echo "will build: ${IMAGE}:${VER}"

      - name: Verify patch is present
        run: |
          grep -q 'hideUpstreamModelInUserLogs' model/log_other.go \
            || { echo "::error::补丁丢失：model/log_other.go 里找不到 hideUpstreamModelInUserLogs"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ env.VER }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
